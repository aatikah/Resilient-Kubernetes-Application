<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102a43">
    <title>Techway Tasks</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">TECHWAY · RESILIENT KUBERNETES APP</p>
        <h1>Tasks, without the busywork.</h1>
        <p class="intro">A small working app backed by PostgreSQL, with Redis caching and Kubernetes health checks.</p>
      </header>

      <section class="panel" aria-labelledby="tasks-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">YOUR WORKSPACE</p>
            <h2 id="tasks-heading">Task list</h2>
          </div>
          <button id="refresh" class="quiet-button" type="button">Refresh</button>
        </div>

        <form id="task-form">
          <label class="visually-hidden" for="task-title">New task</label>
          <input id="task-title" name="title" maxlength="200" placeholder="What needs to get done?" required>
          <button type="submit">Add task <span aria-hidden="true">↗</span></button>
        </form>
        <p id="message" class="message" role="status" aria-live="polite">Loading tasks…</p>
        <ul id="tasks" class="tasks"></ul>
      </section>

      <footer>Frontend · API · PostgreSQL · Redis</footer>
    </main>
  </body>
</html>
