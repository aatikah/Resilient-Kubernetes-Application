apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: techway-backend-pdb
  namespace: techway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: techway-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: techway-frontend-pdb
  namespace: techway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: techway-frontend
---
