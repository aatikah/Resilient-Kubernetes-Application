apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: techway-ingress
  namespace: techway
spec:
  ingressClassName: nginx
  rules:
    - host: techway.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: techway-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: techway-frontend
                port:
                  number: 80
---
